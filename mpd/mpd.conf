# Required files
db_file            "~/.config/mpd/database"
log_file           "~/.config/mpd/log"

# Music directory (where your local music lives)
music_directory    "~/Music"

# Audio output - this goes to your speakers
audio_output {
    type    "pulse"
    name    "PulseAudio"
}

# Audio output - this feeds cava (the visualizer)
audio_output {
    type    "fifo"
    name    "Cava FIFO"
    path    "/tmp/mpd.fifo"
    format  "44100:16:2"
}

# Auto-update music directory
auto_update "yes"
