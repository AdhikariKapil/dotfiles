# Disk Widget
shape {
    size = 150, 75
    color = rgba(198, 196, 197, 0.8)
    rounding = 20
    position = 285, -130
    halign = center
    valign = center
    zindex = 11
}

label {
    text = <b>󰋊</b>
    color = rgba(25,20,20,1.0)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 285, -120
    halign = center
    valign = center
    zindex = 12
}

label {
    text = cmd[update:60000] sh -c "df -h / | awk 'NR==2 {print \$3 \"/\" \$2}'"
    color = rgba(25,20,20,1.0)
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = 285, -145
    halign = center
    valign = center
    zindex = 12
}


# Battery Bar
shape {
    monitor =
    size = 320, 100
    color = rgba(136, 136, 136, 0.8)
    rounding = 25
    position = 200, -235
    halign = center
    valign = center
    zindex = 11
}

# Battery Inner icon block
shape {
    monitor =
    size = 100, 20
    color = rgba(25, 20, 20, 1.0)
    rounding = 5
    position = 200, -205
    halign = center
    valign = center
    zindex = 12
}

label {
    monitor =
    text = cmd[update:1000] status=$(cat /sys/class/power_supply/BAT1/status 2>/dev/null); if [ "$status" = "Discharging" ]; then echo " <b>!</b> "; else echo " <b>󰚥</b> "; fi
    color = rgba(136, 136, 136, 0.8)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 200, -205
    halign = center
    valign = center
    zindex = 13
}

label {
    monitor =
    text = cmd[update:1000] cat /sys/class/power_supply/BAT1/capacity | sed 's/.*/<b>&%<\/b>/'
    color = rgba(25, 20, 20, 1.0)
    font_size = 24
    font_family = JetBrainsMono Nerd Font
    position = 200, -235
    halign = center
    valign = center
    zindex = 12
}

label {
    monitor =
    text = cmd[update:1000] cat /sys/class/power_supply/BAT1/status
    color = rgba(25, 20, 20, 1.0)
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = 200, -265
    halign = center
    valign = center
    zindex = 12
}
