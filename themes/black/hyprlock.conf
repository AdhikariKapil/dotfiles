# =========================
# Network Widget
# =========================

shape {
    size = 150, 75
    color = rgba(198, 196, 197, 0.8)
    rounding = 20
    position = 115, -130
    halign = center
    valign = center
    zindex = 11
}

# Network icon
label {
    text = cmd[update:2000] sh -c 'TYPE=$(nmcli -t -f TYPE,STATE dev | grep ":connected" | head -n1 | cut -d: -f1); if [ "$TYPE" = "wifi" ]; then echo "󰖩"; elif [ "$TYPE" = "ethernet" ]; then echo "󰈀"; else echo "󰖪"; fi'

    color = rgba(25, 20, 20, 1.0)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 115, -116
    halign = center
    valign = center
    zindex = 12
}

# Network name
label {
    text = cmd[update:2000] sh -c 'TYPE=$(nmcli -t -f DEVICE,TYPE,STATE dev status | grep ":connected" | head -n1 | cut -d: -f2); if [ "$TYPE" = "wifi" ]; then nmcli -t -f ACTIVE,SSID dev wifi | grep "^yes" | cut -d: -f2 | cut -c1-14; elif [ "$TYPE" = "ethernet" ]; then echo "Ethernet"; else echo "Offline"; fi'

    color = rgba(25, 20, 20, 1.0)
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = 115, -144
    halign = center
    valign = center
    zindex = 12
}


