$wallpapers = /home/whothis/.config/themes/black/wallpapers
# BACKGROUND
background {
    monitor =
    path = $wallpapers/16.jpeg
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# --- LEFT COLUMN ---

# LOGIN CARD
shape {
    monitor =
    size = 360, 380
    color = rgba(0, 0, 0, 0.3)
    rounding = 25
    border_size = 0
    position = -200, 160
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:1000] hostname
    color = rgba(185, 175, 165, 1.0)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = -200, 300
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = Log in
    color = rgba(240, 230, 220, 1.0)
    font_size = 42
    font_family = JetBrainsMono Nerd Font
    position = -200, 240
    halign = center
    valign = center
    zindex = 2
}

# Username Display 
shape {
    monitor =
    size = 320, 70
    color = rgba(136, 136, 136, 0.8)
    rounding = 20
    position = -200, 130
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = username
    color = rgba(25, 20, 20, 1.0)
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = -310, 150
    halign = center
    valign = center
    zindex = 3
}

label {
    monitor =
    text = cmd[update:1000] echo "<b>$USER</b>"
    color = rgba(25, 20, 20, 1.0)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = -290, 115
    halign = center
    valign = center
    zindex = 3
}

# Password Input

label {
    monitor =
    text = password
    color = rgba(25, 20, 20, 1.0)
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = -310, 60
    halign = center
    valign = center
    zindex = 3
}

input-field {
    monitor =
    size = 320, 70
    outline_thickness = 0
    dots_size = 0.25
    dots_spacing = 0.4
    dots_center = false
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(136, 136, 136, 0.8)
    font_color = rgba(25, 20, 20, 1.0)
    fade_on_empty = false
    placeholder_text = 
    hide_input = false
    rounding = 20
    position = -200, 40
    halign = center
    valign = center
    zindex = 2
}

# CLOCK CARD
shape {
    monitor =
    size = 360, 160
    color = rgba(0, 0, 0, 0.3)
    rounding = 25
    position = -200, -140
    halign = center
    valign = center
    # zindex = 2
}

label {
    monitor =
    text = cmd[update:1000] date +"<b>%H:%M</b>"
    color = rgba(240, 230, 220, 1.0)
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = -200, -125
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:1000] uptime -p | sed -e 's/up /  UPTIME /' -e 's/ hours, /H/' -e 's/ minutes/M/' -e 's/ hour, /H/' -e 's/ minute/M/'
    color = rgba(185, 175, 165, 1.0)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = -200, -195
    halign = center
    valign = center
    zindex = 2
}


# --- RIGHT COLUMN ---

# PROFILE CARD (Blurred)
shape {
    monitor =
    size = 360, 380
    color = rgba(0, 0, 0, 0.3)
    rounding = 25
    position = 200, 160
    halign = center
    valign = center
    zindex = 1
}

image {
    monitor =
    path = $wallpapers/me.jpeg
    size = 120
    rounding = 20
    border_size = 4
    border_color = rgba(186, 61, 61, 1.0)
    position = 200, 260
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +"%a" | tr '[:lower:]' '[:upper:]')</b>"
    color = rgba(240, 230, 220, 1.0)
    font_size = 38
    font_family = JetBrainsMono Nerd Font
    position = 200, 150
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:1000] date +"%d %B, %Y"
    color = rgba(185, 175, 165, 1.0)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 200, 100
    halign = center
    valign = center
    zindex = 11
}

