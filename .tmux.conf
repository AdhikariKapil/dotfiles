set -g default-terminal "tmux-256color"
set -g allow-passthrough on
set -g visual-activity off

# --- Transparency Fixes ---
set -g window-style 'bg=terminal'
set -g window-active-style 'bg=terminal'
# ---------------------------

set -ga terminal-features ",*:hyperlinks,*:RGB,*:sixel,*:kitty"
set -ga terminal-overrides ",*:RGB"

unbind C-b
set-option -g prefix C-Space

set -g base-index 1
set -g pane-base-index 1

set -g default-command "fish"

#Copy mode
unbind v
bind v copy-mode

#vim copy mode navigation
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

unbind C-a
bind -n C-s next-window

set -g mouse on
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind-key -n M-z resize-pane -Z

# # resize pane sizes
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind d detach-client

unbind %
bind-key "'" split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"


# Plugins
set -g @plugin "tmux-plugins/tpm"
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin "tmux-plugins/tmux-sensible"

set -g @plugin 'omerxx/tmux-sessionx' #default keybind <prefix> O to activate
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @plugin 'tmux-plugins/tmux-yank'

set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-battery'

# Configure Online status
set -p @online_icon "ok"
set -g @offline_icon "nok"

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-save-interval '10'

set -g @sessionx-window-mode on
set -g @sessionx-bind 's'

# --- STATUS BAR (TRANSPARENT) ---
set -g status-style "bg=default,fg=white"
set -g status-position bottom
set -g status-justify "absolute-centre"
set -g status-left-length 100
set -g status-right-length 100

# Left side (no bg=black, inherits transparency)
set -g status-left "#[fg=white,bold]  #S #[fg=grey] │ #[fg=white]  #{b:pane_current_path} #[fg=grey]#{?window_zoomed_flag,│,}#[fg=white]#{?window_zoomed_flag,  zoom ,}"

# Right side (no bg=black, inherits transparency)
set -g status-right "#{?#{==:#{online_status},ok},#[fg=white] 󰖩 on ,#[fg=red,bold]#[reverse] 󰖪 off }"

# Inactive windows (no bg=black, inherits transparency)
set -g window-status-style "fg=grey"
set -g window-status-separator "#[fg=grey]│"

# Active window (Kept bg=white so it stands out against the transparent bg)
set -g window-status-current-style "bg=white,fg=black,bold"

# tmux display popups
unbind t
unbind m
unbind f
unbind s
unbind p

bind t display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "fish"
bind p display-popup -w 95% -h 95% -E "rmpc"
bind m display-menu -T "#[align=centre]Config" -x C -y C \
    ".fish"            z  "display-popup -w 85% -h 85% -E 'nvim ~/.config/caelestia/user-config.fish'" \
    ".tmux.conf"        t  "display-popup -w 85% -h 85% -E 'nvim ~/.tmux.conf'" \
    "nvim"              v  "display-popup -w 95% -h 95% -E 'nvim'" \
    "rename session"    r  "command-prompt -I '#S' 'rename-session -- %%'" \
    "quit"              q  ""
bind C-n display-popup -E 'bash -c "read -p \"Session name: \" name; tmux new-session -d -s \$name && tmux switch-client -t \$name"'
bind C-c display-popup -E 'bash -c "read -p \"Window name: \" name; tmux new-window -d -n \$name"'
bind C-p display-popup -E "ipython"
bind f display-popup \
  -d "#{pane_current_path}" \
  -w 90% \
  -h 90% \
  -E "yazi"
bind C-a display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "wiremix"

# Custom clock color (removed the background color tag)
set -ga status-right "#[fg=#b6dde6] 󰭦 %Y-%m-%d 󰅐 %H:%M "

run '~/.tmux/plugins/tpm/tpm'
